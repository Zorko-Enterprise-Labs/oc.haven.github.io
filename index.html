<style>
  :root {
    --bg: #f6f6fc;
    --ink: #171717;
    --muted: #555555;
    --peri: #818cf8;
    --peri-deep: #5b63d6;
    --peri-soft: #e4e6fb;
    --line: #d8daf2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10111a;
      --ink: #eceef8;
      --muted: #9a9db5;
      --peri: #8f99fa;
      --peri-deep: #b7bcf7;
      --peri-soft: #1e2033;
      --line: #2a2c44;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    background:
      radial-gradient(40% 35% at 25% 20%, var(--peri-soft), transparent 70%),
      radial-gradient(35% 30% at 80% 85%, var(--peri-soft), transparent 70%);
    z-index: -1;
  }
  main {
    width: 100%;
    max-width: 520px;
    text-align: center;
  }
  .book {
    width: 104px;
    height: 104px;
    margin: 0 auto 20px;
    display: block;
  }
  .book .page-l, .book .page-r { transform-origin: 50% 100%; }
  .book .page-r { animation: flip 6s ease-in-out infinite; }
  @keyframes flip {
    0%, 70%, 100% { transform: scaleX(1); }
    80% { transform: scaleX(-0.15); }
    90% { transform: scaleX(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .book .page-r { animation: none; }
  }
  .wordmark {
    display: block;
    width: 100%;
    max-width: 360px;
    height: auto;
    margin: 0 auto;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  .rule {
    width: 56px;
    height: 3px;
    border-radius: 2px;
    background: var(--peri);
    margin: 28px auto;
  }
  p.lead {
    font-size: 16px;
    line-height: 1.65;
    color: var(--muted);
    max-width: 420px;
    margin: 0 auto;
  }
  .pills {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 32px;
  }
  .tba {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink);
    background: color-mix(in srgb, var(--bg) 70%, transparent);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--peri);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .3; } }
  footer {
    margin-top: 48px;
    font-size: 12px;
    color: var(--muted);
  }
  footer a { color: var(--peri-deep); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
